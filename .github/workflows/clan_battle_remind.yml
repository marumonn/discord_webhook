name: Clan Battle Simple Test

on:
  workflow_dispatch: # 手動実行用ボタンを有効化
  schedule:
    - cron: '*/30 * * * *' # 30分おき（不要ならこの2行を消してください）

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send Message to Discord
        run: |
          # status.txtの中身を確認
          STATUS=$(cat status.txt)
          
          # 「active」の時だけ通知を送る（「done」なら送らない）
          if [ "$STATUS" == "active" ]; then
            echo "通知を送信します"
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"content\": \"@everyone クランバトルは終わりましたか？ \n終わったらこちらから報告してください：https://YOUR_USERNAME.github.io/YOUR_REPO_NAME/\"}" \
                 ${{ secrets.DISCORD_WEBHOOK_URL }}
          else
            echo "ステータスが $STATUS のため、通知をスキップしました"
          fi