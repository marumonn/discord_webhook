<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>クラバト完了ボタン</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body class="container">
    <h1>今日のクラバト終了！</h1>
    <p>ボタンを押すと、今日の通知を停止します。</p>
    
    <input type="password" id="token" placeholder="GitHubトークンを入力（初回のみ）">
    <button id="done-btn" class="contrast">終わったよ！</button>
    <p id="message"></p>

    <script>
        const OWNER = 'marumonn';
        const REPO = 'discord_webhook';
        const FILE_PATH = 'status.txt';
        const TOKEN_STORAGE_KEY = 'gh_token_saved';

        document.getElementById('done-btn').onclick = async () => {
            const token = document.getElementById('token').value;
            const msgArea = document.getElementById('message');
            
            // 入力値の検証
            if (!token || !token.trim()) {
                msgArea.innerText = "❌ トークンを入力してください";
                return;
            }

            // トークンフォーマット検査（基本的な形式確認）
            if (token.length < 20) {
                msgArea.innerText = "❌ トークンの形式が不正です";
                return;
            }

            msgArea.innerText = "処理中...";
            document.getElementById('done-btn').disabled = true;

            try {
                // 1. 現在のファイルのSHA（バージョン情報）を取得
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        msgArea.innerText = "❌ トークンが無効です";
                    } else if (res.status === 403) {
                        msgArea.innerText = "❌ 権限がありません";
                    } else {
                        msgArea.innerText = "❌ 処理に失敗しました";
                    }
                    document.getElementById('done-btn').disabled = false;
                    return;
                }

                const fileData = await res.json();
                const sha = fileData.sha;

                // 2. ファイルを 'done' に更新
                const updateRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({
                        message: "Status updated via Web",
                        content: btoa("done"),
                        sha: sha
                    })
                });

                if (updateRes.ok) {
                    msgArea.innerText = "✅ 更新成功！今日の通知はもう来ません。";
                    // トークン入力欄をクリア
                    document.getElementById('token').value = '';
                } else {
                    msgArea.innerText = "❌ 処理に失敗しました";
                }
            } catch (e) {
                // 詳細なエラー情報は表示しない
                msgArea.innerText = "❌ 通信エラーが発生しました";
                console.error('Internal error:', e); // コンソールのみ
            } finally {
                document.getElementById('done-btn').disabled = false;
            }
        };

        // ページロード時の警告
        window.addEventListener('load', () => {
            console.warn('⚠️ セキュリティ警告: このコンソールにトークンを入力・表示しないでください。');
        });
    </script>
</body>
</html>
